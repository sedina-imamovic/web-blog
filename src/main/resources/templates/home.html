<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Travel Blog</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .hero {
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 25px;
            background-color: #ff7b00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .btn:hover {
            background-color: #e66f00;
        }
    </style>

</head>
<body>


<hr>

<div class="hero">
    <div class="overlay"></div>

    <div class="content">
        <h1>My Travel Blog</h1>
        <a th:href="@{/posts}" class="btn">Enter Blog</a>
    </div>
</div>

</body>
</html>
