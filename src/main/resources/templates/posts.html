<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        .navbar {
            background: #222;
            padding: 15px;
        }

        .navbar a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
        }

        .post {
            background: white;
            margin-bottom: 25px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
            display: flex;
        }

        .post:hover {
            transform: translateY(-5px);
        }

        .post img {
            width: 300px;
            height: 220px;
            object-fit: cover;
        }

        .post-content {
            padding: 20px;
        }

        .post-content h2 {
            margin-top: 0;
        }

        .post-content a {
            text-decoration: none;
            color: black;
        }

        @media (max-width: 768px) {
            .post {
                flex-direction: column;
            }

            .post img {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>

<nav style="padding:15px; background-color:#222;">
    <a th:href="@{/home}" style="color:white; margin-right:15px;">Home</a>
    <a th:href="@{/posts}" style="color:white; margin-right:15px;">Posts</a>
    <a th:href="@{/posts/create}" style="color:white;">Create Post</a>
</nav>

<div class="container">

    <div th:each="post : ${posts}" class="post">

        <img th:if="${post.imageUrl != null}"
             th:src="${post.imageUrl}"/>

        <div class="post-content">

            <a th:href="@{/posts/{id}(id=${post.id})}">
                <h2 th:text="${post.title}"></h2>
            </a>

            <small th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></small>

        </div>

    </div>

</div>

</body>
</html>
